[project]
name = "agentmarket-sdk"
version = "0.1.0"
description = "AgentMarket SDK - 面向 AI Agent 的按次付费数据集市客户端"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmarket"]
