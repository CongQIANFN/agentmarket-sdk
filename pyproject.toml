[project]
name = "agentmarket-sdk"
version = "0.2.5"
description = "AgentMarket SDK - 面向 AI Agent 的按次付费数据集市客户端"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agentmarket = "agentmarket.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmarket"]
